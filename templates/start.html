<h2>Crear mi PayLink</h2>
<form method="post" action="/start">
<label>Nombre del negocio</label><br><input name="business_name" required><br>
<label>Nombre de contacto</label><br><input name="contact_name"><br>
<label>WhatsApp (con código país, solo números)</label><br><input name="whatsapp" required><br>
<label>País (2 letras, ej: NI)</label><br><input name="country"><br>
<label>Moneda (ej: USD)</label><br><input name="currency" value="USD"><br>
<label>Monto 1</label><br><input name="amount1" type="number" value="10"><br>
<label>Monto 2</label><br><input name="amount2" type="number" value="20"><br>
<label>Monto 3</label><br><input name="amount3" type="number" value="50"><br>
<button type="submit">Continuar → Conectar Stripe</button>
